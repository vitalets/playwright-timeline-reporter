name: example-sharding

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/example-sharding.yml'
      - 'src/**'
      - 'example/**'
      - 'package*.json'
      - 'tsconfig*.json'
      - '.parcelrc'
      - '.npmrc'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium

      - name: Run example shard ${{ matrix.shard }}
        # Keep the workflow green despite intentional test failures.
        continue-on-error: true
        working-directory: example
        run: npx playwright test --shard=${{ matrix.shard }}/2 --reporter=blob

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: example/blob-report
          retention-days: 1
          if-no-files-found: error

  merge-reports:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Download blob reports
        uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: example/blob-report
          merge-multiple: true

      - name: Merge example reports
        working-directory: example
        run: npx playwright merge-reports -c playwright.config.ts ./blob-report
