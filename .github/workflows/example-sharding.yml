name: example-sharding

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/example-sharding.yml'
      - 'src/**'
      - 'example/**'
      - 'package*.json'
      - 'tsconfig*.json'
      - '.parcelrc'
      - '.npmrc'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      PWTEST_BLOB_DO_NOT_REMOVE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium

      - name: Run example shard 1
        # Keep the workflow green despite intentional test failures.
        continue-on-error: true
        working-directory: example
        run: npx playwright test --shard=1/2 --reporter=blob

      - name: Run example shard 2
        continue-on-error: true
        working-directory: example
        run: npx playwright test --shard=2/2 --reporter=blob

      - name: Merge example reports
        working-directory: example
        run: npx playwright merge-reports -c playwright.config.ts ./blob-report
