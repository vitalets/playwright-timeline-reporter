name: publish

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Channel
        required: true
        type: choice
        default: ''
        options:
          - ''
          - stable
          - next
      version:
        description: Release version type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      dry-run:
        description: Dry run
        required: false
        type: boolean
        default: false
      skip-npm-publish:
        description: Skip NPM publish
        required: false
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-24.04

    permissions:
      contents: write # For git operations (commit, tag, push)
      id-token: write # Required for OIDC trusted publishing

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run tsc
      - run: npx publint
      - run: npm run test:all

      - uses: vitalets/npm-release@v2
        with:
          channel: ${{ inputs.channel }}
          version: ${{ inputs.version }}
          skip-npm-publish: ${{ inputs.skip-npm-publish }}
          dry-run: ${{ inputs.dry-run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
